<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaniSetu - Multilingual Voice & Text Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { width: 100%; max-width: 680px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 85vh; }
    .header { background: #1b365d; color: #ffffff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 1.25rem; font-weight: 600; }
    .header span { font-size: 0.8rem; background: #e65100; padding: 4px 8px; border-radius: 12px; font-weight: 500; }
    .toolbar { background: #f8f9fa; padding: 10px 20px; border-bottom: 1px solid #e9ecef; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .toolbar-left { display: flex; align-items: center; gap: 8px; }
    select { padding: 6px 10px; border-radius: 6px; border: 1px solid #ced4da; outline: none; }
    #chatbox { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fbfbfb; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; line-height: 1.45; font-size: 0.92rem; word-wrap: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #1b365d; color: #ffffff; border-bottom-right-radius: 2px; }
    .bot { align-self: flex-start; background: #e9ecef; color: #212529; border-bottom-left-radius: 2px; border: 1px solid #dee2e6; }
    .meta-bar { font-size: 0.72rem; color: #6c757d; margin-top: 4px; display: flex; justify-content: flex-end; gap: 8px; }
    .footer { padding: 12px 16px; background: #ffffff; border-top: 1px solid #e9ecef; display: flex; gap: 8px; align-items: center; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: #1b365d; }
    button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    .btn-send { background: #1b365d; color: #ffffff; }
    .btn-send:hover { background: #142845; }
    .btn-mic { background: #e9ecef; color: #212529; font-size: 1.1rem; }
    .btn-mic.listening { background: #dc3545; color: #ffffff; animation: pulse 1.2s infinite; }
    .btn-clear { background: transparent; color: #6c757d; font-size: 0.8rem; border: 1px solid #ced4da; padding: 4px 8px; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <h1>VaniSetu वाणीसेतु</h1>
        <small style="opacity: 0.85;">Multilingual Scheme Assistant — AlgoRhythmics</small>
      </div>
      <span>SIH 2026</span>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <label for="langSelect">Language:</label>
        <select id="langSelect">
          <option value="auto" selected>Auto-Detect</option>
          <option value="hi">Hindi (हिंदी)</option>
          <option value="mr">Marathi (मराठी)</option>
          <option value="gu">Gujarati (ગુજરાતી)</option>
          <option value="en">English</option>
        </select>
      </div>
      <div>
        <span id="latencyBadge" style="color: #28a745; margin-right: 8px;"></span>
        <button class="btn-clear" onclick="resetSession()">Clear Chat</button>
      </div>
    </div>

    <div id="chatbox">
      <div class="msg bot">
        Namaste! I am VaniSetu. Ask me about Rajasthan Government scholarship schemes, scooty yojana, free tablets, or admission rules in Hindi, Marathi, Gujarati, or English.
      </div>
    </div>

    <div class="footer">
      <button id="micBtn" class="btn-mic" onclick="toggleMic()" title="Speak in your language">🎤</button>
      <input type="text" id="queryInput" placeholder="Type query or use mic..." onkeydown="if(event.key==='Enter') sendQuery()" />
      <button class="btn-send" onclick="sendQuery()">Send</button>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    const SESSION_ID = "session_" + Math.random().toString(36).substring(2, 9);
    const chatbox = document.getElementById("chatbox");
    const queryInput = document.getElementById("queryInput");
    const micBtn = document.getElementById("micBtn");
    const latencyBadge = document.getElementById("latencyBadge");

    let recognition;
    let isListening = false;

    // Web Speech API Initialization
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        queryInput.value = transcript;
        sendQuery();
      };
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
      };
      recognition.onerror = () => {
        isListening = false;
        micBtn.classList.remove("listening");
      };
    }

    function toggleMic() {
      if (!recognition) return alert("Speech recognition is not supported in this browser. Please use Chrome.");
      const langMap = { hi: "hi-IN", mr: "mr-IN", gu: "gu-IN", en: "en-IN", auto: "hi-IN" };
      recognition.lang = langMap[document.getElementById("langSelect").value] || "hi-IN";

      if (!isListening) {
        recognition.start();
        isListening = true;
        micBtn.classList.add("listening");
      } else {
        recognition.stop();
      }
    }

    function speakText(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const langMap = { hi: "hi-IN", mr: "mr-IN", gu: "gu-IN", en: "en-IN", auto: "hi-IN" };
      utterance.lang = langMap[lang] || "hi-IN";
      window.speechSynthesis.speak(utterance);
    }

    async function sendQuery() {
      const query = queryInput.value.trim();
      const lang = document.getElementById("langSelect").value;
      if (!query) return;

      appendMessage(query, "user");
      queryInput.value = "";
      latencyBadge.innerText = "Thinking...";

      const startTime = performance.now();

      try {
        const response = await fetch(`${API_BASE}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: query,
            language: lang,
            session_id: SESSION_ID
          })
        });

        const elapsed = (performance.now() - startTime).toFixed(0);
        const data = await response.json();

        if (data.success) {
          appendMessage(data.response_text, "bot");
          latencyBadge.innerText = `${elapsed}ms`;
          speakText(data.response_text, lang);
        } else {
          appendMessage("Error: Could not process request.", "bot");
        }
      } catch (err) {
        appendMessage("Connection error: Ensure FastAPI server is running on http://localhost:8000.", "bot");
        latencyBadge.innerText = "Offline";
      }
    }

    async function resetSession() {
      await fetch(`${API_BASE}/api/chat/session/${SESSION_ID}`, { method: "DELETE" }).catch(() => {});
      chatbox.innerHTML = `<div class="msg bot">Chat history cleared. How can I help you today?</div>`;
      latencyBadge.innerText = "";
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatbox.appendChild(msgDiv);
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>

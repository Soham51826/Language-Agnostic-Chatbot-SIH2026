<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VaniSetu - Backend Test Client</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; }
    #chatbox { border: 1px solid #ccc; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 12px; border-radius: 8px; background: #fafafa; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; }
    .user { background: #e3f2fd; text-align: right; }
    .bot { background: #e8f5e9; text-align: left; }
    .controls { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type="text"] { flex: 1; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; border: none; border-radius: 4px; background: #1b365d; color: white; }
    button:disabled { background: #aaa; }
  </style>
</head>
<body>
  <h2>VaniSetu AI Test Harness</h2>
  <div class="controls">
    <label>Language: </label>
    <select id="langSelect">
      <option value="hi" selected>Hindi (hi-IN)</option>
      <option value="mr">Marathi (mr-IN)</option>
      <option value="gu">Gujarati (gu-IN)</option>
      <option value="en">English (en-IN)</option>
    </select>
    <button id="micBtn" onclick="toggleMic()">🎤 Speak</button>
  </div>
  <div id="chatbox"></div>
  <div class="controls">
    <input type="text" id="queryInput" placeholder="Type query (or speak)..." onkeydown="if(event.key==='Enter') sendQuery()" />
    <button id="sendBtn" onclick="sendQuery()">Send</button>
  </div>

  <script>
    const API_URL = "http://localhost:8000/api/chat";
    const chatbox = document.getElementById("chatbox");
    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById("queryInput").value = text;
        sendQuery();
      };
      recognition.onend = () => {
        isListening = false;
        document.getElementById("micBtn").innerText = "🎤 Speak";
      };
    }

    function toggleMic() {
      if (!recognition) return alert("Web Speech API not supported in this browser.");
      const langMap = { hi: "hi-IN", mr: "mr-IN", gu: "gu-IN", en: "en-IN" };
      recognition.lang = langMap[document.getElementById("langSelect").value];

      if (!isListening) {
        recognition.start();
        isListening = true;
        document.getElementById("micBtn").innerText = "Listening...";
      } else {
        recognition.stop();
      }
    }

    function speakText(text, lang) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const langMap = { hi: "hi-IN", mr: "mr-IN", gu: "gu-IN", en: "en-IN" };
      utterance.lang = langMap[lang] || "hi-IN";
      window.speechSynthesis.speak(utterance);
    }

    async function sendQuery() {
      const input = document.getElementById("queryInput");
      const text = input.value.trim();
      const lang = document.getElementById("langSelect").value;
      if (!text) return;

      appendMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text, language: lang })
        });
        const data = await res.json();
        appendMessage(data.response_text, "bot");
        speakText(data.response_text, lang);
      } catch (err) {
        appendMessage("Error: Could not reach FastAPI backend.", "bot");
      }
    }

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
